<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="siteTitle">Інтернет-магазин</title>
    <!-- Добавили версию v=7, чтобы гитхаб гарантированно сбросил кэш -->
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

    <header>
        <div class="logo" id="mainLogo">LOGOTYPE</div>
        <p class="subtitle" id="mainSubtitle">ТОВАРИ, ЯКІ ТИ ЛЮБИШ</p>
    </header>

    <main>
        <!-- Головний блок товару -->
        <section class="main-offer-box">
            <h1 id="productName">Назва товару</h1>
            <p class="product-lead" id="productDescription">Короткий опис товару.</p>
            
            <div class="price-badge-box">
                <span class="old-price" id="oldPriceText">Стара ціна: 000 грн</span>
                <div class="action-price">
                    <span id="actionLabel">🔥 Акція:</span>
                    <span class="new-price" id="newPriceText">000 грн</span>
                </div>
            </div>
            
            <button class="order-anchor-btn" onclick="scrollToForm()" id="buttonText">ЗАМОВИТИ БЕЗ ДЗВІНКІВ</button>
        </section>

        <!-- Блок переваг -->
        <section class="benefits-box">
            <h2 id="benefitsTitle">Чому цей товар такий крутий?</h2>
            <div class="benefits-list" id="benefitsContainer">
                <!-- Картки вставляються автоматично -->
            </div>
        </section>

        <!-- Форма замовлення -->
        <section class="order-section" id="order-form-block">
            <div class="form-container">
                <h2>Оформлення замовлення</h2>
                <p class="form-subtitle" id="formSubtitle">Заповніть форму, і замовлення відправиться в обробку</p>
                
                <form id="landingOrderForm">
                    <label for="orderProduct" id="labelProduct">Обраний товар:</label>
                    <input type="text" id="orderProduct" readonly value="">
                    
                    <input type="text" id="userName" placeholder="Ваше Ім'я" required>
                    <input type="tel" id="userPhone" placeholder="Номер телефону" required>
                    
                    <button type="submit" class="submit-order-btn" id="submitBtnText">Підтвердити замовлення 🚀</button>
                </form>
            </div>
        </section>
    </main>

    <!-- СПЛИВАЮЧЕ ПОПАП ВІКНО ПО ЦЕНТРУ ЕКРАНА -->
    <div id="popupOverlay" class="popup-overlay">
        <div class="popup-box">
            <button class="popup-close-btn" onclick="closePopup()">&times;</button>
            <div id="statusMessage">
                <!-- Тут буде текст замовлення -->
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- ПОЛНОЦЕННЫЙ ПУЛЬТ УПРАВЛЕНИЯ САЙТОМ (РЕДАКТИРУЙ ТУТ) -->
    <!-- ================================================================= -->
    <script>
        const LANDING_CONFIG = {
            // 🎨 НАСТРОЙКА ЦВЕТОВ, БОРДЕРОВ И ДЕТАЛЕЙ Сайта
            styles: {
                bodyBg: "#0b0f17",          // Главный фон сайта
                headerBg: "#111827",        // Фон шапки сверху
                cardBg: "#111827",          // Фон основных блоков (оффер, преимущества, форма)
                priceBoxBg: "#1f2937",      // Фон плашки с ценами
                
                // Тексты и Акценты
                mainTextColor: "#ffffff",   // Цвет обычного текста (100% сочный белый)
                titleColor: "#ffffff",      // Цвет заголовков (H1, названий блоков)
                accentColor: "#10b981",     // Акцентный цвет (зеленая цена, заголовок преимуществ)
                oldPriceColor: "#ef4444",   // Цвет зачёркнутой старой цены
                
                // 🛑 НАСТРОЙКА БОРДЕРОВ (РАМОК БЛОКОВ)
                blockBorderSize: "1px",     // Толщина рамок блоков (1px, 2px, 3px и т.д.)
                blockBorderStyle: "solid",  // Стиль рамки блоков (solid — сплошная, dashed — пунктир)
                blockBorderColor: "#1f2937", // Цвет рамок вокруг блоков хедера и карточек
                
                // Поля ввода (Инпуты)
                inputBg: "#1f2937",         // Фон полей ввода имени и телефона
                inputTextColor: "#ffffff",  // Цвет текста, который вводит покупатель
                inputBorderColor: "#374151", // Цвет рамки вокруг инпутов
                
                // Кнопка 1 ("Заказать без звонков")
                btn1Bg: "#6366f1",          
                btn1HoverBg: "#4f46e5",     
                btn1TextColor: "#ffffff",   
                
                // Кнопка 2 (Нижняя кнопка формы)
                btn2Bg: "#111827",          
                btn2HoverBg: "#ffffff",     
                btn2TextColor: "#ffffff",   
                btn2TextHoverColor: "#111827" 
            },

            // 📝 НАСТРОЙКА ТЕКСТА И ОФФЕРА
            pageTitle: "Офіційний магазин | Купити вигідно",
            logoText: "bestyshop.shop",
            subtitleText: "ТОВАРИ, ЯКІ ТИ ЛЮБИШ",
            productName: "🌌 Лазерний проектор Астронавт",
            productDesc: "Перетвори свою кімнату на справжній відкритий космос! 8 неймовірних режимів яскравих туманностей, космічні зірки та зручне керування з пульта.",
            oldPrice: "Стара ціна: 840 грн",
            actionLabel: "🔥 Акція:",
            newPrice: "499 грн",
            buttonText: "ЗАМОВИТИ БЕЗ ДЗВІНКІВ",

            benefitsTitle: "Чому цей нічник такий крутий?",
            benefits: [
                { icon: "🔮", title: "8 режимів світіння:", text: "створюй космічну атмосферу під будь-який настрій." },
                { icon: "🕹️", title: "Пульт ДУ в комплекті:", text: "змінюй кольори, яскравість та швидкість не встаючи з ліжка." },
                { icon: "🛸", title: "Обертання на 360°:", text: "направляй проекцію на стелю, стіни або підлогу під будь-яким кутом." },
                { icon: "🎁", title: "Ідеальний подарунок:", text: "викликає повний захват як у маленьких дітей, так і у дорослих." }
            ]
        };

        // =================================================================
        // ЛОГИКА ДИНАМИЧЕСКОГО ПЕРЕКРАШИВАНИЯ И СТИЛИЗАЦИИ
        // =================================================================
        function applyStyles() {
            const root = document.documentElement;
            const s = LANDING_CONFIG.styles;
            
            root.style.setProperty('--body-bg', s.bodyBg);
            root.style.setProperty('--header-bg', s.headerBg);
            root.style.setProperty('--card-bg', s.cardBg);
            root.style.setProperty('--price-box-bg', s.priceBoxBg);
            root.style.setProperty('--main-text-color', s.mainTextColor);
            root.style.setProperty('--title-color', s.titleColor);
            root.style.setProperty('--accent-color', s.accentColor);
            root.style.setProperty('--old-price-color', s.oldPriceColor);
            
            root.style.setProperty('--block-border-size', s.blockBorderSize);
            root.style.setProperty('--block-border-style', s.blockBorderStyle);
            root.style.setProperty('--block-border-color', s.blockBorderColor);
            
            root.style.setProperty('--input-bg', s.inputBg);
            root.style.setProperty('--input-text-color', s.inputTextColor);
            root.style.setProperty('--input-border-color', s.inputBorderColor);
            root.style.setProperty('--btn1-bg', s.btn1Bg);
            root.style.setProperty('--btn1-hover-bg', s.btn1HoverBg);
            root.style.setProperty('--btn1-text-color', s.btn1TextColor);
            root.style.setProperty('--btn2-bg', s.btn2Bg);
            root.style.setProperty('--btn2-hover-bg', s.btn2HoverBg);
            root.style.setProperty('--btn2-text-color', s.btn2TextColor);
            root.style.setProperty('--btn2-text-hover-color', s.btn2TextHoverColor);
        }

        function initLanding() {
            applyStyles();

            document.title = LANDING_CONFIG.pageTitle;
            document.getElementById('mainLogo').innerText = LANDING_CONFIG.logoText;
            document.getElementById('mainSubtitle').innerText = LANDING_CONFIG.subtitleText;
            document.getElementById('productName').innerText = LANDING_CONFIG.productName;
            document.getElementById('productDescription').innerText = LANDING_CONFIG.productDesc;
            document.getElementById('oldPriceText').innerText = LANDING_CONFIG.oldPrice;
            document.getElementById('actionLabel').innerText = LANDING_CONFIG.actionLabel;
            document.getElementById('newPriceText').innerText = LANDING_CONFIG.newPrice;
            document.getElementById('buttonText').innerText = LANDING_CONFIG.buttonText;
            document.getElementById('benefitsTitle').innerText = LANDING_CONFIG.benefitsTitle;
            document.getElementById('orderProduct').value = `${LANDING_CONFIG.productName} — ${LANDING_CONFIG.newPrice}`;

            const container = document.getElementById('benefitsContainer');
            container.innerHTML = '';
            
            LANDING_CONFIG.benefits.forEach(item => {
                const row = document.createElement('div');
                row.className = 'benefit-item';
                row.innerHTML = `
                    <div class="benefit-icon">${item.icon}</div>
                    <div class="benefit-content">
                        <strong>${item.title}</strong> ${item.text}
                    </div>
                `;
                container.appendChild(row);
            });
        }

                      function scrollToForm() {
            document.getElementById('order-form-block').scrollIntoView({ behavior: 'smooth' });
        }

        // Обработка формы, показ попапа и отправка в Телеграм
        document.getElementById('landingOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const product = document.getElementById('orderProduct').value;
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const status = document.getElementById('statusMessage');
            
            // 1. Формируем красивый текст для попапа на сайте
            status.innerHTML = `<h3>🎉 Замовлення прийнято!</h3>
                                <p class="popup-p">Ми вже передали вашу заявку менеджеру.</p>
                                <hr class="popup-hr">
                                <p class="popup-detail"><b>Товар:</b> ${product}</p>
                                <p class="popup-detail"><b>Ім'я:</b> ${name}</p>
                                <p class="popup-detail"><b>Телефон:</b> ${phone}</p>`;
            
            // 2. Включаем показ белого попапа на экране
            document.getElementById('popupOverlay').classList.add('active');

            // 3. Формируем текст сообщения для Телеграм-бота
            const message = `🔔 Новая заявка!\n📦 Товар: ${product}\n👤 Имя: ${name}\n📞 Телефон: ${phone}`;
            
            // 4. Отправляем данные в Телеграм (замени ТУТ свой ТОКЕН и ID чата, если они затерлись)
            const token = TELEGRAM_CONFIG.token;  // Или впиши сюда токен строкой 'ТВОЙ_ТОКЕН'
            const chatId = TELEGRAM_CONFIG.chatId; // Или впиши сюда ID строкой 'ТВОЙ_ID'
            const url = `https://telegram.org{token}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (!response.ok) {
                    console.error('Ошибка отправки в Телеграм');
                }
            })
            .catch(error => console.error('Ошибка сети:', error));

            // 5. Сбрасываем поля формы
            document.getElementById('landingOrderForm').reset();
            document.getElementById('orderProduct').value = `${LANDING_CONFIG.productName} — ${LANDING_CONFIG.newPrice}`;
        }); // Все скобки закрыты чётко!

        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
        }

        window.onload = initLanding;
