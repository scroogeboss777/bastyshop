<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="siteTitle">Інтернет-магазин</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <div class="logo" id="mainLogo">✨ BESTY SHOP</div>
        <p class="subtitle" id="mainSubtitle">Якісні товари за найкращими цінами</p>
    </header>

    <main>
        <section class="catalog-section">
            <h2 class="section-title" id="catalogTitle">Наші пропозиції</h2>
            
            <div class="carousel-wrapper">
                <button class="carousel-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
                <button class="carousel-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
                
                <div class="carousel-container">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Карточки товаров генерируются автоматически из конфига внизу -->
                    </div>
                </div>
            </div>
        </section>

        <section class="order-section" id="order-form-block">
            <div class="form-container">
                <h2>Оформлення замовлення</h2>
                <p class="form-subtitle">Заповніть форму, і наш менеджер зв'яжеться з вами</p>
                
                <form id="catalogOrderForm">
                    <label for="selectedProduct">Обраний товар:</label>
                    <input type="text" id="selectedProduct" readonly value="">
                    
                    <input type="text" id="userName" placeholder="Ваше Ім'я" required>
                    <input type="tel" id="userPhone" placeholder="Номер телефону" required>
                    
                    <button type="submit" class="submit-order-btn">Підтвердити замовлення 🚀</button>
                </form>
                <div id="statusMessage" class="hidden"></div>
            </div>
        </section>
    </main>

    <!-- ================================================================= -->
    <!-- БЛОК НАПОВНЕННЯ САЙТУ (РЕДАГУЙ ТІЛЬКИ ЦЕЙ БЛОК ВНИЗУ) -->
    <!-- ================================================================= -->
    <script>
        const SHOP_CONFIG = {
            // 1. Шапка та назва сайту
            title: "Besty Shop | Офіційний магазин",
            logo: "📦 BESTY SHOP",
            subtitle: "Тільки перевірені товари • Швидка доставка",
            catalogTitle: "Оберіть ваш варіант комплектації",

            // 2. Список товарів (Каталог). Можеш міняти, видаляти або додавати нові блоки { }
            products: [
                {
                    badge: "Популярно",
                    img: "https://ibb.co",
                    title: "Комплект 'Mini'",
                    desc: "Базовий варіант для невеликих локацій. Оптимальне співвідношення ціни та функціоналу.",
                    oldPrice: "499 грн",
                    newPrice: "199 грн"
                },
                {
                    badge: "Акція",
                    img: "https://ibb.co",
                    title: "Комплект 'Light'",
                    desc: "Стандартний набір, який включає все необхідне для швидкого старту та використання.",
                    oldPrice: "599 грн",
                    newPrice: "299 грн"
                },
                {
                    badge: "Хіт продажів",
                    img: "https://ibb.co",
                    title: "Комплект 'Comfort'",
                    desc: "Оптимальний вибір більшості покупців. Покращена комплектація та розширена гарантія.",
                    oldPrice: "899 грн",
                    newPrice: "499 грн",
                    isFeatured: true // Цей товар буде стартовим по центру
                },
                {
                    badge: "Максимум",
                    img: "https://ibb.co",
                    title: "Комплект 'Smart Pro'",
                    desc: "Преміальна версія з максимальними можливостями та інтелектуальним керуванням.",
                    oldPrice: "1399 грн",
                    newPrice: "799 грн"
                },
                {
                    badge: "Преміум",
                    img: "https://ibb.co",
                    title: "Комплект 'Mega Smart'",
                    desc: "Ексклюзивний набір для професійного використання. Максимальний об'єм та потужність.",
                    oldPrice: "1799 грн",
                    newPrice: "999 грн"
                }
            ]
        };

        // =================================================================
        // ЛОГІКА РОБОТИ САЙТУ (СЮДИ МОЖНА НЕ ЛАЗИТИ)
        // =================================================================
        let currentIndex = 0;

        function initShop() {
            document.title = SHOP_CONFIG.title;
            document.getElementById('mainLogo').innerText = SHOP_CONFIG.logo;
            document.getElementById('mainSubtitle').innerText = SHOP_CONFIG.subtitle;
            document.getElementById('catalogTitle').innerText = SHOP_CONFIG.catalogTitle;

            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';

            SHOP_CONFIG.products.forEach((prod, index) => {
                if (prod.isFeatured) currentIndex = index;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="badge">${prod.badge}</div>
                    <div class="product-img-block">
                        <img src="${prod.img}" alt="${prod.title}">
                    </div>
                    <h3>${prod.title}</h3>
                    <p class="card-desc">${prod.desc}</p>
                    <div class="card-price">
                        <span class="old-p">${prod.oldPrice}</span>
                        <span class="new-p">${prod.newPrice}</span>
                    </div>
                    <button class="select-btn ${prod.isFeatured ? 'dynamic-btn' : ''}" onclick="selectProduct('${prod.title} - ${prod.newPrice}')">Хочу цей</button>
                `;
                track.appendChild(card);
            });

            updateCarousel();
        }

        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            const cards = document.querySelectorAll('.product-card');
            
            cards.forEach((card, index) => {
                card.classList.remove('active');
                if (index === currentIndex) card.classList.add('active');
            });

            const cardWidth = 330; 
            const offset = -(currentIndex * cardWidth) + cardWidth; 
            track.style.transform = `translateX(${offset}px)`;
            
            // Автопідстановка назви товару у форму
            const activeProd = SHOP_CONFIG.products[currentIndex];
            document.getElementById('selectedProduct').value = `${activeProd.title} - ${activeProd.newPrice}`;
        }

        function changeSlide(direction) {
            const cards = document.querySelectorAll('.product-card');
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= cards.length) currentIndex = cards.length - 1;
            updateCarousel();
        }

        function selectProduct(productName) {
            document.getElementById('selectedProduct').value = productName;
            document.getElementById('order-form-block').scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('catalogOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const product = document.getElementById('selectedProduct').value;
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            
            const status = document.getElementById('statusMessage');
            status.innerHTML = `<h3>🎉 Замовлення прийнято!</h3>
                                <p><b>Товар:</b> ${product}</p>
                                <p><b>Покупець:</b> ${name}</p>
                                <p><b>Телефон:</b> ${phone}</p>`;
            status.className = "success-box";
            status.classList.remove('hidden');
        });

        window.onload = initShop;
    </script>
</body>
</html>
